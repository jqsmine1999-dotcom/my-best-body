<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MyBestBody</title>
  <meta name="description" content="目標体重に向けて食事のPFCと運動を記録し、進み具合に応じたアドバイスを表示する個人向けアプリ。">
  <meta name="theme-color" content="#e4e5e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1e22" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MyBestBody">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
  <main id="app" aria-busy="true">
    <!-- JS が届く前から見せるスケルトン -->
    <div class="screen" data-skeleton>
      <header class="top"><div class="sk title"></div></header>
      <section class="glass card">
        <div class="ring-wrap">
          <div class="sk circle"></div>
          <div><div class="sk line w80"></div><div class="sk line w60"></div><div class="sk line w80"></div></div>
        </div>
        <div class="sk line"></div><div class="sk line"></div><div class="sk line"></div>
      </section>
      <section class="glass card"><div class="sk line w40"></div><div class="sk line"></div><div class="sk line w80"></div></section>
      <section class="glass card"><div class="sk line w40"></div><div class="sk block"></div></section>
    </div>
  </main>
  <nav class="tabbar glass" aria-label="メニュー" data-skeleton-tabbar><div class="sk line" style="margin:18px"></div><div></div><div></div><div></div></nav>
  <div id="toast" class="glass" role="status" aria-live="polite"></div>
</body>
</html>
